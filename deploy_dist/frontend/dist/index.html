<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog App - Port 10012</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 90%;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }
        .info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .info p {
            margin: 10px 0;
            color: #555;
        }
        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        .dot.success {
            background: #28a745;
        }
        .dot.error {
            background: #dc3545;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .todo-list {
            margin-top: 20px;
        }
        .todo-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .todo-item input[type="checkbox"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
        }
        .todo-item.completed span {
            text-decoration: line-through;
            color: #999;
        }
        .loading {
            text-align: center;
            color: #666;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Blog App</h1>
        <div class="info">
            <p><strong>项目名称:</strong> blog-app</p>
            <p><strong>部署端口:</strong> 10012</p>
            <p><strong>部署目录:</strong> /opt/deploy/blog-app_10012</p>
        </div>
        <div id="backend-status" class="status">
            <span class="dot"></span>
            <span>检查后端状态中...</span>
        </div>
        <div class="todo-list">
            <h3 style="margin-bottom: 15px; color: #333;">待办事项列表</h3>
            <div id="todo-items" class="loading">加载中...</div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:10012/api/todos';
        
        async function checkBackendStatus() {
            const statusEl = document.getElementById('backend-status');
            const dotEl = statusEl.querySelector('.dot');
            const textEl = statusEl.querySelector('span:last-child');
            
            try {
                const response = await fetch(API_URL);
                if (response.ok) {
                    statusEl.className = 'status success';
                    dotEl.className = 'dot success';
                    textEl.textContent = '后端服务运行正常';
                    return true;
                } else {
                    throw new Error('HTTP ' + response.status);
                }
            } catch (error) {
                statusEl.className = 'status error';
                dotEl.className = 'dot error';
                textEl.textContent = '后端服务连接失败: ' + error.message;
                return false;
            }
        }
        
        async function loadTodos() {
            const container = document.getElementById('todo-items');
            
            try {
                const response = await fetch(API_URL);
                const todos = await response.json();
                
                if (todos.length === 0) {
                    container.innerHTML = '<p style="text-align:center;color:#999;">暂无待办事项</p>';
                    return;
                }
                
                container.innerHTML = todos.map(todo => `
                    <div class="todo-item ${todo.completed ? 'completed' : ''}">
                        <input type="checkbox" ${todo.completed ? 'checked' : ''} disabled>
                        <span>${todo.title}</span>
                    </div>
                `).join('');
            } catch (error) {
                container.innerHTML = '<p style="text-align:center;color:#dc3545;">加载失败: ' + error.message + '</p>';
            }
        }
        
        checkBackendStatus();
        loadTodos();
    </script>
</body>
</html>
